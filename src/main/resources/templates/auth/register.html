<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><title>Register - PlaceHub</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(circle at top left, #eef2ff 0%, transparent 35%),
              radial-gradient(circle at bottom right, #e0e7ff 0%, transparent 35%),
              var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 18px;
      -webkit-font-smoothing: antialiased;
    }

    /* Register Card */
    .card {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow:
              0 4px 6px rgba(15, 23, 42, 0.04),
              0 12px 30px rgba(15, 23, 42, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow:
              0 8px 12px rgba(15, 23, 42, 0.05),
              0 18px 40px rgba(15, 23, 42, 0.1);
    }

    /* Logo */
    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: var(--primary);
      margin-bottom: 7px;
    }

    .sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      gap: 4px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 11px 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      color: #94a3b8;
      text-decoration: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -1px;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s ease;
    }

    .tab:hover {
      color: var(--primary);
      background: var(--primary-light);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: #fafaff;
    }

    /* Alert */
    .alert {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .alert-err {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* Form Grid */
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 16px;
    }

    .grp {
      margin-bottom: 17px;
    }

    /* Labels */
    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Inputs */
    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #94a3b8;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #94a3b8;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 82px;
      line-height: 1.5;
    }

    /* Register Button */
    .btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 5px 14px rgba(79, 70, 229, 0.25);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Login Link */
    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .link a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* Company Approval Note */
    .note {
      font-size: 11px;
      color: #b45309;
      background: var(--warning-light);
      border: 1px solid #fde68a;
      border-radius: 9px;
      padding: 9px 12px;
      margin-top: 12px;
      text-align: center;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 650px) {
      body {
        padding: 20px 14px;
      }

      .card {
        padding: 28px 22px;
        border-radius: 15px;
      }

      .grid2 {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .logo {
        font-size: 25px;
      }

      .sub {
        font-size: 12px;
        margin-bottom: 22px;
      }

      .tab {
        font-size: 12px;
        padding: 10px 6px;
      }
    }

    @media (max-width: 420px) {
      body {
        padding: 14px 10px;
      }

      .card {
        padding: 24px 17px;
        border-radius: 13px;
      }

      .logo {
        font-size: 23px;
      }

      .tabs {
        margin-bottom: 20px;
      }

      input,
      select,
      textarea {
        padding: 10px 12px;
        font-size: 12px;
      }

      .btn {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎓 PlaceHub</div>
  <div class="sub">Create your account</div>

  <div th:if="${error}" class="alert alert-err" th:text="${error}"></div>

  <div class="tabs">
    <a class="tab" th:classappend="${type == 'student'} ? ' active'" href="/auth/register?type=student">👨‍🎓 Student</a>
    <a class="tab" th:classappend="${type == 'company'} ? ' active'" href="/auth/register?type=company">🏢 Company</a>
  </div>

  <!-- STUDENT -->
  <div th:if="${type == 'student'}">
    <form action="/auth/register/student" method="post">
      <div class="grid2">
        <div class="grp"><label>Full Name *</label><input name="name" placeholder="Rahul Sharma" required></div>
        <div class="grp"><label>Roll Number *</label><input name="rollNumber" placeholder="CS2021001" required></div>
        <div class="grp"><label>Email *</label><input type="email" name="email" placeholder="you@email.com" required></div>
        <div class="grp"><label>Password *</label><input type="password" name="password" placeholder="Min 6 chars" required></div>
        <div class="grp"><label>Department *</label><input name="department" placeholder="Computer Science" required></div>
        <div class="grp"><label>Batch *</label><input name="batch" placeholder="2021-2025" required></div>
        <div class="grp"><label>CGPA *</label><input type="number" name="cgpa" step="0.01" min="0" max="10" placeholder="8.5" required></div>
        <div class="grp"><label>Backlogs</label><input type="number" name="backlogs" value="0" min="0"></div>
        <div class="grp"><label>Phone</label><input name="phone" placeholder="9876543210"></div>
        <div class="grp"><label>10th %</label><input type="number" name="tenthPercentage" step="0.01" placeholder="92.0"></div>
      </div>
      <div class="grp"><label>12th %</label><input type="number" name="twelfthPercentage" step="0.01" placeholder="88.0"></div>
      <button type="submit" class="btn">Register as Student</button>
    </form>
  </div>

  <!-- COMPANY -->
  <div th:if="${type == 'company'}">
    <form action="/auth/register/company" method="post">
      <div class="grid2">
        <div class="grp"><label>Company Name *</label><input name="companyName" placeholder="TechCorp Ltd" required></div>
        <div class="grp"><label>Industry</label><input name="industry" placeholder="Information Technology"></div>
        <div class="grp"><label>Email *</label><input type="email" name="email" placeholder="hr@company.com" required></div>
        <div class="grp"><label>Password *</label><input type="password" name="password" placeholder="Min 6 chars" required></div>
        <div class="grp"><label>Location</label><input name="location" placeholder="Bangalore"></div>
        <div class="grp"><label>Phone</label><input name="phone" placeholder="080-12345678"></div>
        <div class="grp"><label>Contact Person</label><input name="contactPerson" placeholder="HR Manager Name"></div>
        <div class="grp"><label>Website</label><input name="website" placeholder="https://company.com"></div>
      </div>
      <div class="grp"><label>Description</label><textarea name="description" placeholder="Brief company description..."></textarea></div>
      <button type="submit" class="btn">Register Company</button>
      <p class="note">⚠ Company accounts require admin approval before you can login.</p>
    </form>
  </div>

  <div class="link">Already have an account? <a href="/auth/login">Login here</a></div>
</div>
</body>
</html>
