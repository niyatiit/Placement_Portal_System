<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><title>Login - PlaceHub</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --success: #10b981;
      --success-light: #ecfdf5;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
              radial-gradient(circle at top left, #eef2ff 0%, transparent 35%),
              radial-gradient(circle at bottom right, #e0e7ff 0%, transparent 35%),
              var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Login Card */
    .card {
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px;
      box-shadow:
              0 4px 6px rgba(15, 23, 42, 0.04),
              0 12px 30px rgba(15, 23, 42, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow:
              0 8px 12px rgba(15, 23, 42, 0.05),
              0 18px 40px rgba(15, 23, 42, 0.1);
    }

    /* Logo */
    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.7px;
      color: var(--primary);
      margin-bottom: 7px;
    }

    .tagline {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* Alerts */
    .alert {
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .alert-err {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .alert-ok {
      background: var(--success-light);
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    /* Form */
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--text-main);
      background: #ffffff;
      outline: none;
      margin-bottom: 18px;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:hover {
      border-color: #94a3b8;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    /* Login Button */
    .btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 2px;
    }

    .btn:hover {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
      box-shadow: 0 5px 14px rgba(79, 70, 229, 0.25);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Register Link */
    .link {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s ease;
    }

    .link a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }

    /* Demo Credentials */
    .demo {
      background: var(--primary-light);
      border: 1px solid #c7d2fe;
      border-radius: 12px;
      padding: 15px 16px;
      margin-top: 22px;
      font-size: 12px;
      color: #3730a3;
      line-height: 1.8;
    }

    .demo b {
      font-weight: 700;
    }

    .demo b:first-child {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #312e81;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;
        border-radius: 14px;
      }

      .logo {
        font-size: 25px;
      }

      .tagline {
        font-size: 12px;
        margin-bottom: 24px;
      }

      .demo {
        padding: 13px 14px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🎓 PlaceHub</div>
  <div class="tagline">College Placement Portal — Login to continue</div>

  <div th:if="${param.error}" class="alert alert-err">❌ Invalid email or password. Please try again.</div>
  <div th:if="${param.logout}" class="alert alert-ok">✅ You have been logged out successfully.</div>
  <div th:if="${success}" class="alert alert-ok" th:text="${success}"></div>

  <form th:action="@{/auth/login}" method="post">
    <label>Email Address</label>
    <input type="email" name="email" placeholder="Enter your email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>
    <button type="submit" class="btn">Login</button>
  </form>

  <div class="link">New here? <a href="/auth/register">Create an account</a></div>
