<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><title>Error - PlaceHub</title>
  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f0f4f8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    /* Error Card */
    .box{
      background:#ffffff;
      width:100%;
      max-width:520px;
      padding:45px 40px;
      text-align:center;
      border-radius:10px;
      box-shadow:0 4px 16px rgba(0,0,0,.12);
      border:1px solid #e2e8f0;
    }

    /* Warning Icon */
    .icon{
      width:80px;
      height:80px;
      margin:0 auto 22px;
      border-radius:50%;
      background:#fef3c7;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:40px;
    }

    /* Heading */
    h1{
      font-size:24px;
      font-weight:700;
      color:#1e293b;
      margin-bottom:10px;
    }

    /* Description */
    p{
      color:#64748b;
      font-size:14px;
      line-height:1.6;
      margin-bottom:22px;
    }

    /* Error Message */
    .err-msg{
      background:#fee2e2;
      border:1px solid #fca5a5;
      color:#991b1b;
      border-radius:6px;
      padding:14px 16px;
      font-size:13px;
      line-height:1.5;
      margin-bottom:24px;
      text-align:left;
      word-break:break-word;
    }

    /* Back Button */
    a{
      display:inline-block;
      padding:11px 26px;
      background:#2563eb;
      color:#ffffff;
      border-radius:6px;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      transition:background .2s ease,transform .2s ease;
    }

    a:hover{
      background:#1d4ed8;
      transform:translateY(-1px);
    }

    /* Responsive */
    @media(max-width:600px){
      .box{
        padding:35px 25px;
      }

      h1{
        font-size:21px;
      }

      .icon{
        width:70px;
        height:70px;
        font-size:34px;
      }
    }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">⚠️</div>
  <h1>Something Went Wrong</h1>
  <p>An unexpected error occurred. Please try again.</p>
  <div class="err-msg" th:if="${error}" th:text="${error}">Error details here</div>
  <a href="/">← Back to Home</a>
</div>
</body>
</html>
